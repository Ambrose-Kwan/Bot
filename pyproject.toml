[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-checkout"
version = "1.0.0"
description = "Modular high-concurrency e-commerce checkout automation framework with curl_cffi TLS impersonation and async state machine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nexus Automation Labs" }
]
dependencies = [
    "curl_cffi>=0.7.0b4",
    "pydantic>=2.7.0",
    "loguru>=0.7.2",
    "rich>=13.7.1",
    "aiofiles>=23.2.1",
    "playwright>=1.40.0",
    "cryptography>=41.0.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]